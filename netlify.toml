# Netlify runs the Next.js app itself. Its OpenNext adapter is picked up from `next build`
# automatically, so nothing here mentions it; `publish` must point at the build output, not
# at `public/`, or the site would serve the static folder and 404 every route.
#
# The OCI host keeps running the same commit as a staging origin; it is not behind this site.
[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# The app sets no framing or sniffing headers of its own.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
